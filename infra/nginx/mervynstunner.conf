# mervynstunner.com on the shared Lightsail server.
# Installed as /etc/nginx/sites-available/mervynstunner.conf; certbot adds the
# HTTPS server block and the HTTP -> HTTPS redirect to the installed copy.

limit_req_zone $binary_remote_addr zone=portfolio_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mervynstunner.com www.mervynstunner.com;

    root /var/www/mervynstunner;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The public may only read. Content is added on the server itself
    # (npm run db:seed, or curl to 127.0.0.1:3400 with the admin key).
    location /api/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=portfolio_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files never change, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
